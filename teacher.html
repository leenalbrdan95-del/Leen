  q17: { level: 3, max: 4, type: 'track', label: 'مسألة تأجير الدراجات',
         support:   { g1: { type: 'mcq', ans: 'c', pts: 1 }, g2: { type: 'mcq', ans: 'b', pts: 1 },

var QUESTION_IDS = ['q1','q2','q3','q4','q5','q6','q7','q8','q9','q10','q11','q12','q13','q14','q15','q16','q17','q18'];

// يقبل الأرقام العربية والهندية، والكسور a/b، والفاصلة العشرية، وإشارة السالب بأشكالها
function parseNum(s) {
  if (s === null || s === undefined) return NaN;
  s = String(s).trim();
  if (!s) return NaN;
  var map = { '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9',
              '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9' };
  s = s.replace(/[٠-٩۰-۹]/g, function (c) { return map[c]; })
       .replace(/[−–—‐]/g, '-').replace(/[٫,]/g, '.').replace(/\s+/g, '')
       .replace(/^x=/i, '').replace(/^[a-z]=/i, '');
  var m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if (m) { var d = parseFloat(m[2]); return d === 0 ? NaN : parseFloat(m[1]) / d; }
  if (!/^-?\d*\.?\d+$/.test(s)) return NaN;
  return parseFloat(s);
}

function numEq(a, b) { var x = parseNum(a); return !isNaN(x) && Math.abs(x - b) < 1e-6; }

function scorePart(spec, val) {
  if (spec.type === 'mcq') return val === spec.ans ? spec.pts : 0;
  if (spec.type === 'num') return numEq(val, spec.ans) ? spec.pts : 0;
  return 0;
}

// answers: { q1:'b', q11:'8', q14:['p','k','w','m'], q15:{a:'inf',...}, q16:{a:'b',b:'6'}, q17:{g1:'c',...} }
// tracks:  { q17:'support' | 'challenge', q18: ... }
function scoreExam(answers, tracks) {
  answers = answers || {}; tracks = tracks || {};
  var perQ = {}, levels = { 1: 0, 2: 0, 3: 0 }, total = 0;
  QUESTION_IDS.forEach(function (id) {
    var sp = SCORING[id], a = answers[id], p = 0;
    if (sp.type === 'mcq') p = a === sp.ans ? sp.max : 0;
    else if (sp.type === 'num') p = numEq(a, sp.ans) ? sp.max : 0;
    else if (sp.type === 'order') {
      var ok = 0;
      if (Object.prototype.toString.call(a) === '[object Array]')
        for (var i = 0; i < sp.ans.length; i++) if (a[i] === sp.ans[i]) ok++;
      p = ok === sp.ans.length ? 2 : (ok >= 2 ? 1 : 0);
    } else if (sp.type === 'classify') {
      var c = 0; a = a || {};
      for (var k in sp.ans) if (a[k] === sp.ans[k]) c++;
      p = c === 3 ? 2 : (c === 2 ? 1 : 0);
    } else if (sp.type === 'multi') {
      a = a || {};
      for (var pk in sp.parts) p += scorePart(sp.parts[pk], a[pk]);
    } else if (sp.type === 'track') {
      var tr = tracks[id] === 'challenge' ? 'challenge' : (tracks[id] === 'support' ? 'support' : null);
      a = a || {};
      if (tr) for (var sk in sp[tr]) p += scorePart(sp[tr][sk], a[sk]);
    }
    perQ[id] = p; levels[sp.level] += p; total += p;
  });
  return { total: total, levels: levels, perQ: perQ };
}

function gradeLabel(total) {
  if (total >= 27) return 'ممتاز';
  if (total >= 24) return 'جيد جدًا';
  if (total >= 20) return 'جيد';
  if (total >= 15) return 'مقبول';
  return 'بحاجة إلى دعم';
}

  if($('#qr') && typeof QRCode!=='undefined') new QRCode($('#qr'),{text:url,width:230,height:230});
  if($('#fq')) $('#fq').onclick=function(){
    $('#layer').innerHTML='<div class="full" id="fl"><div><h1 style="margin:0 0 10px;font-size:2.2em">اختبار الوحدة الثانية · المعادلات ✨</h1><div id="qr2" style="display:inline-block;padding:14px;border:1px solid var(--line);border-radius:20px"></div><div style="color:var(--muted);margin-top:10px;font-size:1.3em">امسحي الرمز أو اكتبي رمز الاختبار:</div><div class="codebig" style="font-size:5em">'+esc(EMAIL_CFG.code)+'</div><div style="color:var(--muted)">(اضغطي للإغلاق)</div></div></div>';
    var z=Math.min(420,innerHeight*0.5); if(typeof QRCode!=='undefined') new QRCode($('#qr2'),{text:url,width:z,height:z}); $('#fl').onclick=function(){ $('#layer').innerHTML=''; };
  };
  if($('#cu')) $('#cu').onclick=function(){ copy(url,'✅ نُسخ رابط الطالبات'); };
  if($('#an')) $('#an').onclick=function(){ raw=$('#ta').value; try{localStorage.setItem('eq8_teacher_paste',raw)}catch(e){} rows=parse(raw); render(); if(!rows.length) toast('لم يُعثر على رموز تحقق في النص'); };
  if($('#cl')) $('#cl').onclick=function(){ raw=''; rows=[]; try{localStorage.removeItem('eq8_teacher_paste')}catch(e){} render(); };
  if($('#cx')) $('#cx').onclick=function(){
    var t=['اسم الطالبة','الشعبة','العلامة /30','المستوى 1 /10','المستوى 2 /12','المستوى 3 /8','التقدير'].concat(MAX.map(function(m,i){return 'س'+(i+1)})).join('\t')+'\n'+
      sorted().filter(function(r){return !r.dup}).map(function(r){ return [r.name,r.section,r.total,r.l1,r.l2,r.l3,r.grade].concat(r.pq).join('\t'); }).join('\n');
    copy(t,'✅ نُسخ الكشف — الصقيه في Excel');
  };
}
function copy(t,m){ try{ navigator.clipboard.writeText(t).then(function(){toast(m)},function(){toast('تعذّر النسخ')}); }catch(e){ toast('تعذّر النسخ'); } }
function toast(m){ var d=document.createElement('div'); d.className='toast'; d.textContent=m; document.body.appendChild(d); setTimeout(function(){d.remove()},3000); }
if(raw) rows=parse(raw);
gate();
})();
</script>
